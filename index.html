<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zac Javid | Bespoke Training & Apparel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,700;0,900;1,700&display=swap"
    rel="stylesheet">
  <style>
    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background-color: #0A0A0A;
      color: #FFFFFF;
      -webkit-tap-highlight-color: transparent;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    h1,
    h2,
    .serif-font {
      font-family: 'Playfair Display', serif;
    }

    .bg-obsidian {
      background-color: #0A0A0A;
    }

    .text-white {
      color: #FFFFFF;
    }

    .text-scarlet {
      color: #DC143C;
    }

    .bg-scarlet {
      background-color: #DC143C;
    }

    .bg-charcoal {
      background-color: #1A1A1A;
    }

    .border-steel {
      border-color: #2C2C2C;
    }

    .text-steel {
      color: #A1A1AA;
    }

    /* Advanced Global CTA Architecture */
    .cta-base {
      display: inline-flex !important;
      align-items: center !important;
      justify-content: space-between !important;
      gap: 1rem;
      padding: 0.35rem;
      padding-left: 1.75rem;
      border-radius: 30px !important;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-size: 13px;
      transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
      white-space: nowrap;
      cursor: pointer;
      min-height: 52px;
      border: none;
      box-sizing: border-box;
      text-decoration: none !important;
      position: relative;
      overflow: hidden;
      z-index: 1;
    }

    .cta-base::after {
      content: '';
      position: absolute;
      top: 0;
      left: -150%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg,
          transparent,
          rgba(255, 255, 255, 0.2),
          transparent);
      transition: all 0.6s ease;
      z-index: -1;
    }

    .cta-base:hover::after {
      left: 150%;
    }

    .cta-base:active {
      transform: scale(0.96) !important;
      transition: all 0.1s ease;
    }

    @media (max-width: 640px) {
      .cta-base {
        width: 100% !important;
        justify-content: center !important;
        padding-left: 0.35rem;
        padding-right: 0.35rem;
      }

      .cta-base .cta-icon-circle {
        position: absolute;
        right: 0.35rem;
      }

      .cta-icon-left .cta-icon-circle {
        position: absolute;
        left: 0.35rem;
        right: auto;
      }
    }

    .cta-icon-left {
      padding-left: 0.35rem !important;
      padding-right: 1.75rem !important;
      flex-direction: row-reverse !important;
    }

    .cta-icon-circle {
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      flex-shrink: 0;
    }

    .cta-icon-circle svg {
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .cta-base:hover .cta-icon-circle {
      transform: scale(1.05);
    }

    .cta-base:not(.cta-icon-left):hover svg {
      transform: translateX(4px);
    }

    .cta-icon-left:hover svg {
      transform: translateX(-4px);
    }

    .cta-primary {
      background-color: #DC143C !important;
      color: #FFFFFF !important;
      box-shadow: 0 4px 15px rgba(220, 20, 60, 0.2);
    }

    .cta-primary .cta-icon-circle {
      background-color: #FFFFFF !important;
      color: #DC143C !important;
    }

    .cta-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(220, 20, 60, 0.4);
    }

    .cta-secondary {
      background-color: #FFFFFF !important;
      color: #0A0A0A !important;
      box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1);
    }

    .cta-secondary .cta-icon-circle {
      background-color: #0A0A0A !important;
      color: #FFFFFF !important;
    }

    .cta-secondary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(255, 255, 255, 0.15);
    }

    .cta-black {
      background-color: #1A1A1A !important;
      color: #FFFFFF !important;
      border: 1px solid rgba(255, 255, 255, 0.08) !important;
    }

    .cta-black .cta-icon-circle {
      background-color: #FFFFFF !important;
      color: #DC143C !important;
    }

    .cta-black:hover {
      transform: translateY(-2px);
      border-color: rgba(220, 20, 60, 0.5) !important;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
    }

    .reveal {
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 1.2s ease-out, transform 1.2s ease-out;
      will-change: opacity, transform;
    }

    .reveal.active {
      opacity: 1;
      transform: translateY(0);
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    @media (max-width: 768px) {
      .leading-none {
        line-height: 1.1 !important;
      }
    }
  </style>

</head>

</html>
